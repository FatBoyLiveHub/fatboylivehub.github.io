<title>FAT BOY LIVE Privacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Layout: same stream-room night palette as the Skill Challenge rules; one reading column, a data table as the anchor */
  :root {
    color-scheme: dark;
    --bg: #140c22; --panel: #1f1433; --line: #3d2a63;
    --fg: #f4eefc; --muted: #b9abd8;
    --blue: #7cc4ff; --gold: #ffcc33; --orange: #ff7a1a;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; }
  .wrap { max-width: 820px; margin: 0 auto; padding-inline: 18px; padding-block: 20px 56px; display: grid; gap: 28px; }
  .bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar label { color: var(--muted); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  select { background: var(--panel); color: var(--fg); border: 2px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 15px; }
  select:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  header { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  header img { width: 112px; height: 112px; border-radius: 50%; border: 3px solid var(--gold); }
  .eyebrow { font-family: var(--display); color: var(--orange); font-size: 14px; letter-spacing: .08em; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 38px); line-height: 1.12; margin: 4px 0 10px; text-wrap: balance; color: var(--gold); }
  .lead { margin: 0; max-width: 62ch; color: var(--blue); }
  h2 { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .02em; margin: 0 0 10px; text-wrap: balance; }
  section p, section li { max-width: 68ch; }
  section p { margin: 0 0 10px; }
  section ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
  a { color: var(--gold); }
  .tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th { text-align: left; padding: 10px 14px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--panel); }
  td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { font-weight: 700; }
  td.keep { color: var(--blue); }
  .yt { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .yt p:last-child, .yt ul:last-child { margin-bottom: 0; }
  .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .contact .mail { font-weight: 700; user-select: all; }
  button { background: var(--orange); color: #1a0f05; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .foot { color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
  @media (max-width: 620px) { header { grid-template-columns: 1fr; } header img { width: 92px; height: 92px; } }
  body { margin: 0; }
</style>
</head>

<script>
const MAIL = 'info.nexora@gmx.net', RULES = 'index.html';
const A = (href, txt) => `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
const T = {
  en: {
    langLabel: 'Language', h1: 'Privacy Policy', contact: 'Contact:', copy: 'Copy email', copied: 'Copied',
    lead: 'This page explains which data the FAT BOY LIVE stream game uses when you take part in the live chat on the YouTube channel @fatboy_live, why, and for how long.',
    binding: 'The English version is binding. The German version is a translation.', updated: 'Last updated: 10 October 2026',
    sections: [
      ['Who is responsible', `<p>Fat Boy Live, operator of the YouTube channel @fatboy_live – an offering of Wellenberg &amp; Polok GbR, Priesterbergweg 25, 53773 Hennef (Sieg), Germany. Partners: Dominik Wellenberg and Sebastian Alexander Polok. Contact: ${MAIL}.</p>`],
      ['YouTube API Services', `<div class="yt"><p>FAT BOY LIVE uses <b>YouTube API Services</b> to read the live chat of our own livestreams and to show likes, viewers and subscribers in the game. By taking part you also accept the ${A('https://www.youtube.com/t/terms', 'YouTube Terms of Service')}. Google's processing is described in the ${A('https://policies.google.com/privacy', 'Google Privacy Policy')}.</p><p>Viewers never sign in to FAT BOY LIVE and never give the game access to their Google account. If you ever granted an app access to your account, you can remove it on the ${A('https://security.google.com/settings/security/permissions', 'Google security settings page')}.</p></div>`],
      ['Which data we use', `<div class="tablebox"><table><thead><tr><th>Data</th><th>Why</th><th>How long</th></tr></thead><tbody>
        <tr><td>Chat messages</td><td>Your commands (for example !pizza or pew) control the game in real time; the text can appear on screen during the stream.</td><td class="keep">Not stored. Only processed while the stream runs.</td></tr>
        <tr><td>Channel ID and display name</td><td>To count your game progress and missions and to answer !check.</td><td class="keep">Deleted 30 days after your last chat activity.</td></tr>
        <tr><td>Game progress</td><td>Missions, achievements, one in-game like per stream.</td><td class="keep">Deleted 30 days after your last chat activity. Completed achievements are then kept only without name and channel ID.</td></tr>
        <tr><td>Prize claim</td><td>To check and pay out the €10 Skill Challenge (${A(RULES, 'rules')}).</td><td class="keep">Until the claim is settled.</td></tr>
        <tr><td>Email and PayPal address</td><td>Only if you win and write to us, to pay out the prize.</td><td class="keep">Deleted after the payout unless the law requires keeping it (for example tax records).</td></tr>
        <tr><td>Super Chats and gifts</td><td>Name and amount, to show a thank-you in the game.</td><td class="keep">Short technical log, overwritten automatically.</td></tr>
      </tbody></table></div>`],
      ['Where the data is kept', '<p>Everything runs on the operator\'s own computer in Germany. We do not sell data, do not share it with third parties and do not use it for advertising. The game uses no cookies and no tracking.</p>'],
      ['Legal basis', '<ul><li>Running the game you take part in: legitimate interest, Art. 6(1)(f) GDPR.</li><li>Paying out the prize: performance of the promotion, Art. 6(1)(b) GDPR.</li><li>Keeping payout records: legal obligation, Art. 6(1)(c) GDPR.</li></ul>'],
      ['Your rights', `<p>You can ask for access to your data, correction, deletion, restriction, data portability, and you can object to the processing. Write to ${MAIL} with your channel name; we answer within 30 days. You can also complain to a data protection supervisory authority.</p>`],
      ['Age', '<p>The €10 Skill Challenge is open from 16 years (under 18 with parental consent). Playing in the chat itself needs no account with us.</p>'],
    ],
  },
  de: {
    langLabel: 'Sprache', h1: 'Datenschutzerklärung', contact: 'Kontakt:', copy: 'E-Mail kopieren', copied: 'Kopiert',
    lead: 'Hier steht, welche Daten das Stream-Spiel FAT BOY LIVE nutzt, wenn du im Livechat des YouTube-Kanals @fatboy_live mitmachst, wozu und wie lange.',
    binding: 'Verbindlich ist die englische Fassung. Die deutsche Fassung ist eine Übersetzung.', updated: 'Stand: 10. Oktober 2026',
    sections: [
      ['Verantwortlich', `<p>Fat Boy Live, Betreiber des YouTube-Kanals @fatboy_live – ein Angebot der Wellenberg &amp; Polok GbR, Priesterbergweg 25, 53773 Hennef (Sieg). Gesellschafter: Dominik Wellenberg und Sebastian Alexander Polok. Kontakt: ${MAIL}.</p>`],
      ['YouTube API Services', `<div class="yt"><p>FAT BOY LIVE nutzt die <b>YouTube API Services</b>, um den Livechat unserer eigenen Livestreams zu lesen und Likes, Zuschauer und Abonnenten im Spiel anzuzeigen. Mit der Teilnahme gelten auch die ${A('https://www.youtube.com/t/terms', 'Nutzungsbedingungen von YouTube')}. Wie Google Daten verarbeitet, steht in der ${A('https://policies.google.com/privacy', 'Datenschutzerklärung von Google')}.</p><p>Zuschauer melden sich bei FAT BOY LIVE nie an und geben dem Spiel keinen Zugriff auf ihr Google-Konto. Falls du einer App einmal Zugriff gegeben hast, kannst du ihn in den ${A('https://security.google.com/settings/security/permissions', 'Google-Sicherheitseinstellungen')} entfernen.</p></div>`],
      ['Welche Daten wir nutzen', `<div class="tablebox"><table><thead><tr><th>Daten</th><th>Wozu</th><th>Wie lange</th></tr></thead><tbody>
        <tr><td>Chat-Nachrichten</td><td>Deine Befehle (z. B. !pizza oder pew) steuern das Spiel in Echtzeit; der Text kann während des Streams im Bild erscheinen.</td><td class="keep">Nicht gespeichert. Nur während des Streams verarbeitet.</td></tr>
        <tr><td>Kanal-ID und Anzeigename</td><td>Um deinen Spielfortschritt und deine Missionen zu zählen und auf !check zu antworten.</td><td class="keep">Gelöscht 30 Tage nach deiner letzten Chat-Aktivität.</td></tr>
        <tr><td>Spielfortschritt</td><td>Missionen, Erfolge, ein Spiel-Like pro Stream.</td><td class="keep">Gelöscht 30 Tage nach deiner letzten Chat-Aktivität. Geschaffte Erfolge bleiben danach nur ohne Name und Kanal-ID erhalten.</td></tr>
        <tr><td>Gewinnanspruch</td><td>Um die 10-€-Skill-Challenge zu prüfen und auszuzahlen (${A(RULES + '#de', 'Regeln')}).</td><td class="keep">Bis der Anspruch erledigt ist.</td></tr>
        <tr><td>E-Mail- und PayPal-Adresse</td><td>Nur wenn du gewinnst und uns schreibst, für die Auszahlung.</td><td class="keep">Gelöscht nach der Auszahlung, soweit keine gesetzliche Aufbewahrungspflicht besteht (z. B. steuerliche Belege).</td></tr>
        <tr><td>Super Chats und Geschenke</td><td>Name und Betrag, um im Spiel Danke zu sagen.</td><td class="keep">Kurzes technisches Protokoll, wird automatisch überschrieben.</td></tr>
      </tbody></table></div>`],
      ['Wo die Daten liegen', '<p>Alles läuft auf dem eigenen Computer des Betreibers in Deutschland. Wir verkaufen keine Daten, geben sie nicht an Dritte weiter und nutzen sie nicht für Werbung. Das Spiel setzt keine Cookies und kein Tracking ein.</p>'],
      ['Rechtsgrundlage', '<ul><li>Betrieb des Spiels, an dem du teilnimmst: berechtigtes Interesse, Art. 6 Abs. 1 lit. f DSGVO.</li><li>Auszahlung des Preises: Durchführung der Aktion, Art. 6 Abs. 1 lit. b DSGVO.</li><li>Aufbewahrung von Auszahlungsbelegen: gesetzliche Pflicht, Art. 6 Abs. 1 lit. c DSGVO.</li></ul>'],
      ['Deine Rechte', `<p>Du kannst Auskunft, Berichtigung, Löschung, Einschränkung und Datenübertragbarkeit verlangen und der Verarbeitung widersprechen. Schreib an ${MAIL} mit deinem Kanalnamen; wir antworten innerhalb von 30 Tagen. Außerdem kannst du dich bei einer Datenschutz-Aufsichtsbehörde beschweren.</p>`],
      ['Alter', '<p>Die 10-€-Skill-Challenge ist ab 16 Jahren (unter 18 mit Einverständnis der Eltern). Für das Mitspielen im Chat brauchst du bei uns kein Konto.</p>'],
    ],
  },
};
const $ = (id) => document.getElementById(id), sel = $('lang');
function render(l) {
  const t = T[l] || T.en; document.documentElement.lang = l;
  for (const k of ['langLabel', 'h1', 'lead', 'binding', 'updated']) $(k).textContent = t[k];
  $('contactLabel').textContent = t.contact; $('copy').textContent = t.copy;
  $('body').innerHTML = t.sections.map((s) => `<section><h2>${s[0]}</h2>${s[1]}</section>`).join('');
  $('body').style.display = 'grid'; $('body').style.gap = '28px';
  sel.value = l;
}
function pick() {
  const h = (location.hash || '').slice(1).toLowerCase(); if (T[h]) return h;
  try { const s = localStorage.getItem('fb-privacy-lang'); if (s && T[s]) return s; } catch (_) { /* kein Speicher */ }
  for (const n of navigator.languages || [navigator.language || 'en']) { const c = String(n).slice(0, 2).toLowerCase(); if (T[c]) return c; }
  return 'en';
}
sel.addEventListener('change', () => { render(sel.value); try { localStorage.setItem('fb-privacy-lang', sel.value); } catch (_) { /* egal */ } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1).toLowerCase(); if (T[h]) render(h); });
$('copy').addEventListener('click', () => {
  const b = $('copy'), sh = () => { const r = document.createRange(); r.selectNodeContents($('mail')); getSelection().removeAllRanges(); getSelection().addRange(r); };
  const done = () => { b.textContent = (T[sel.value] || T.en).copied; setTimeout(() => { b.textContent = (T[sel.value] || T.en).copy; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(MAIL).then(done, sh); else sh();
});
render(pick());
</script>
