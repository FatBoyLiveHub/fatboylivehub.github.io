<title>FAT BOY Skill Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout: stream-room night palette, one column; the four mission targets (50 · 1 · 250 · 250) are the visual anchor */
  :root {
    color-scheme: dark;
    --bg: #140c22; --panel: #1f1433; --panel-2: #2a1b45; --line: #3d2a63;
    --fg: #f4eefc; --muted: #b9abd8;
    --blue: #7cc4ff; --gold: #ffcc33; --orange: #ff7a1a; --fat: #ff5a4a; --healthy: #4ade80;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
  .wrap { max-width: 860px; margin: 0 auto; padding-inline: 18px; padding-block: 20px 56px; display: grid; gap: 28px; }
  .bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar label { color: var(--muted); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  select { background: var(--panel); color: var(--fg); border: 2px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 15px; }
  select:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  header { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  header img { width: 132px; height: 132px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 0 6px rgba(255, 204, 51, .12); }
  .eyebrow { font-family: var(--display); color: var(--orange); font-size: 14px; letter-spacing: .08em; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 40px); line-height: 1.12; margin: 4px 0 10px; text-wrap: balance; color: var(--gold); }
  .lead { margin: 0; max-width: 62ch; color: var(--blue); }
  .check { display: inline-block; margin-top: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 15px; }
  .check code, td code, .cmd { font-family: var(--body); font-weight: 700; color: var(--gold); }
  h2 { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .02em; margin: 0 0 12px; color: var(--fg); text-wrap: balance; }
  .missions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .m { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .m .goal { font-family: var(--display); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
  .m h3 { margin: 0; font-size: 18px; }
  .m p { margin: 0; color: var(--blue); }
  .m.bonus { grid-column: 1 / -1; }
  .m .kick { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted, #9aa3b5); }
  .allreq { grid-column: 1 / -1; margin: 0; padding: 14px 18px; border: 2px solid var(--gold); border-radius: 14px; font-weight: 700; font-size: 18px; color: var(--blue); }
  .m.bonus .goal { color: var(--blue); }
  .m .tag { justify-self: start; font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--bg); background: var(--blue); border-radius: 999px; padding: 2px 10px; }
  .m.glorp .goal { color: #c084fc; } .m.admin .goal { color: var(--gold); } .m.fat .goal { color: var(--fat); } .m.healthy .goal { color: var(--healthy); }
  .tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; min-width: 420px; }
  th { text-align: left; padding: 10px 14px; font-size: 15px; letter-spacing: .03em; }
  th.fat { background: rgba(255, 90, 74, .18); color: var(--fat); } th.healthy { background: rgba(74, 222, 128, .15); color: var(--healthy); }
  td { padding: 8px 14px; border-top: 1px solid var(--line); vertical-align: top; width: 50%; }
  td .alt { color: var(--muted); font-size: 15px; }
  .note { color: var(--muted); font-size: 15px; margin: 10px 0 0; }
  .spam { background: rgba(255, 204, 51, .1); border: 1px solid rgba(255, 204, 51, .45); border-radius: 12px; padding: 14px 16px; margin: 0; }
  ol.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: r; }
  ol.rules li { counter-increment: r; display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; }
  ol.rules li::before { content: counter(r) "."; font-family: var(--display); color: var(--orange); }
  ol.rules b { display: block; }
  ol.rules p a { color: var(--gold); }
  ol.rules p { margin: 2px 0 0; color: var(--blue); max-width: 68ch; }
  .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .contact .mail { font-weight: 700; user-select: all; }
  button { background: var(--orange); color: #1a0f05; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .foot { color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
  @media (max-width: 620px) {
    header { grid-template-columns: 1fr; justify-items: start; }
    header img { width: 104px; height: 104px; }
    .missions { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) { .m { transition: transform .15s; } .m:hover { transform: translateY(-2px); } }
  body { margin: 0; }
</style>
</head>

  en: { langLabel: 'Language', h1: '€10 for the first player to complete all 4 missions', lead: 'Be the first to finish all four missions in the FAT BOY LIVE stream game and win €10 via PayPal. Free to join. No like, subscription or gift needed.', check: 'Your progress: type <code>!check prize</code> in the live chat',
    missionsTitle: 'The 4 missions', missions: [['Glorp invasions', 'Sometimes the Glorp aliens invade the stream. As soon as the invasion starts, type <span class="cmd">pew</span> in the live chat. Every pew written during the invasion counts (and up to 20 seconds after it ends, because the chat is delayed). Each invasion counts once, no matter how often you type pew.'], ['Admin events', 'When the streamer writes their first admin message, a 2-minute window opens with a countdown on screen. Type <span class="cmd">!joinedadmin</span> in the chat within those 2 minutes. Each admin event counts once. You need 3 different admin events.'], ['Make Fat Boy fatter', 'Type one of the FAT commands below, for example <span class="cmd">!pizza</span>. Every correctly typed command counts once, even when Fat Boy is busy or the command is briefly on cooldown.'], ['Make Fat Boy healthier', 'Type one of the HEALTHY commands below, for example <span class="cmd">!salad</span> or <span class="cmd">!workout</span>. Every correctly typed command counts once.']],
    cmdTitle: 'Commands', fatHead: 'FAT · mission 3', healthHead: 'HEALTHY · mission 4', cmdNote: 'Start your message with the command. Upper or lower case does not matter. The word in brackets works too.',
    spam: '<b>Spam protection:</b> one command per person counts every 20 seconds at most, fat or healthy. Reaching 250 + 250 takes time, and that is the challenge. Bots, multiple accounts and spam do not count.',
    rulesTitle: 'Official rules', rules: [
      ['Organizer', 'Fatboy Live, operator of the YouTube channel “Fat Boy - Live” (@fatboy_live). Contact: ' + MAIL + '.'],
      ['Not affiliated with YouTube', 'This promotion is in no way sponsored, endorsed, administered by or associated with YouTube or Google. All questions go to the organizer only. By taking part you release YouTube and Google from any liability related to this promotion.'],
      ['Free to join', 'No purchase, like, subscription, view count, paid gift or Super Chat is required, and none of these improve your chances.'],
      ['Who can take part', 'Anyone aged 16 or older. Under 18s need permission from a parent or guardian, which the organizer may ask for before paying out. The organizer and people who help develop the game cannot take part.'],
      ['What counts', 'Only what the game records automatically, as described in the missions. Regular chat messages, poll votes, likes, subscriptions, views and gifts do not count toward the prize. All other tasks in the game earn achievements only, no money.'],
      ['One winner', 'The winner is the first person to complete the last of the four missions according to the game log. Missions completed before the start count. The order of achievements in the automatic log and the YouTube channel ID decide. The promotion starts with its announcement in the livestream and ends when the prize has been awarded, at the latest on 31 December 2026.'],
      ['Disqualification and review', 'Spam, bots, multiple accounts of one person, collusion or exploiting bugs lead to disqualification. The organizer reviews the log within 7 days. If the first person is disqualified, the next person to complete all four missions moves up.'],
      ['Prize and payout', 'The prize is €10 (ten euros). The winner is named in the livestream by channel name and emails ' + MAIL + ' with their channel name and a PayPal address. Payout via PayPal within 14 days after confirmation. If the winner does not reply within 14 days of the announcement, the next person moves up. The prize cannot be transferred or paid out in another form.'],
      ['Privacy', 'The organizer processes your channel name, channel ID and game progress to run the promotion, plus the email and PayPal address you send for the payout. This data is deleted after the payout unless the law requires keeping it. Game progress is deleted 30 days after your last chat activity. Requests for access or deletion: ' + MAIL + '. ' + PRIV('Full privacy policy')],
      ['Changes', 'The organizer may end or adjust the promotion only for good reason, such as technical problems or manipulation. Prizes already won stay valid. Published rules are not changed later to the disadvantage of participants.']],
    contact: 'Contact:', copy: 'Copy email', copied: 'Copied', binding: 'The English version of these rules is binding. Other languages are translations for convenience.', updated: 'Last updated: 9 October 2026' },
  de: { langLabel: 'Sprache', h1: '10 € für den Ersten, der alle 4 Missionen schafft', lead: 'Schaffe als Erste/r alle vier Missionen im Stream-Game FAT BOY LIVE und gewinne 10 € per PayPal. Kostenlos. Kein Like, kein Abo, kein Gift nötig.', check: 'Dein Fortschritt: schreib <code>!check prize</code> in den Livechat',
    missionsTitle: 'Die 4 Missionen', missions: [['Glorp-Invasionen', 'Ab und zu greifen die Glorp-Aliens den Stream an. Sobald die Invasion startet, schreib <span class="cmd">pew</span> in den Livechat. Jedes pew während der Invasion zählt (und bis 20 Sekunden nach dem Ende, weil der Chat verzögert ankommt). Jede Invasion zählt einmal, egal wie oft du pew schreibst.'], ['Admin-Events', 'Schreibt der Streamer seine erste Admin-Nachricht, öffnet sich ein 2-Minuten-Fenster mit Countdown im Bild. Schreib in diesen 2 Minuten <span class="cmd">!joinedadmin</span> in den Chat. Jedes Admin-Event zählt einmal. Du brauchst 3 verschiedene Admin-Events.'], ['Fat Boy fetter machen', 'Schreib einen der FETT-Befehle unten, zum Beispiel <span class="cmd">!pizza</span>. Jeder richtig geschriebene Befehl zählt einmal, auch wenn Fat Boy gerade beschäftigt ist oder der Befehl kurz gesperrt ist.'], ['Fat Boy gesünder machen', 'Schreib einen der GESUND-Befehle unten, zum Beispiel <span class="cmd">!salat</span> oder <span class="cmd">!sport</span>. Jeder richtig geschriebene Befehl zählt einmal.']],
    cmdTitle: 'Befehle', fatHead: 'FETT · Mission 3', healthHead: 'GESUND · Mission 4', cmdNote: 'Die Nachricht muss mit dem Befehl beginnen. Groß- und Kleinschreibung ist egal. Das Wort in Klammern funktioniert genauso.',
    spam: '<b>Spam-Schutz:</b> Pro Person zählt höchstens ein Befehl alle 20 Sekunden, egal ob fett oder gesund. Für 250 + 250 brauchst du Zeit, genau das ist die Herausforderung. Bots, Mehrfachkonten und Spam zählen nicht.',
    rulesTitle: 'Teilnahmebedingungen', rules: [
      ['Veranstalter', 'Fatboy Live, Betreiber des YouTube-Kanals „Fat Boy - Live“ (@fatboy_live). Kontakt: ' + MAIL + '.'],
      ['Keine Verbindung zu YouTube', 'Diese Aktion steht in keiner Verbindung zu YouTube oder Google und wird von ihnen weder gesponsert, unterstützt noch organisiert. Ansprechpartner ist ausschließlich der Veranstalter. Mit der Teilnahme stellst du YouTube und Google von jeglicher Haftung im Zusammenhang mit dieser Aktion frei.'],
      ['Kostenlos', 'Kein Kauf, kein Like, kein Abo, keine bestimmte Zahl an Aufrufen, kein bezahltes Gift und kein Super Chat nötig. Nichts davon verbessert die Gewinnchance.'],
      ['Wer teilnehmen darf', 'Alle ab 16 Jahren. Unter 18 nur mit Einverständnis der Erziehungsberechtigten, das der Veranstalter vor der Auszahlung erfragen kann. Der Veranstalter und Personen, die am Spiel mitentwickeln, sind ausgeschlossen.'],
      ['Was zählt', 'Nur was das Spiel automatisch registriert, wie bei den Missionen beschrieben. Normale Chat-Nachrichten, Umfrage-Teilnahmen, Likes, Abos, Aufrufe und Gifts zählen nicht für den Preis. Alle anderen Aufgaben im Spiel bringen nur Erfolge, kein Geld.'],
      ['Ein Gewinner', 'Es gewinnt, wer die letzte der vier Missionen laut Spielprotokoll als Erste/r abschließt. Missionen von vor dem Start zählen mit. Es entscheiden die Reihenfolge der Erfolge im automatischen Protokoll und die YouTube-Kanal-ID. Die Aktion beginnt mit der Ankündigung im Livestream und endet, sobald der Preis vergeben ist, spätestens am 31.12.2026.'],
      ['Ausschluss und Prüfung', 'Spam, Bots, mehrere Konten einer Person, Absprachen oder das Ausnutzen von Fehlern führen zum Ausschluss. Der Veranstalter prüft das Protokoll innerhalb von 7 Tagen. Wird der Erste ausgeschlossen, rückt nach, wer als Nächste/r alle vier Missionen geschafft hat.'],
      ['Preis und Auszahlung', 'Der Preis beträgt 10 € (zehn Euro). Der Gewinner wird im Livestream mit Kanalnamen genannt und schreibt an ' + MAIL + ' mit Kanalnamen und PayPal-Adresse. Auszahlung per PayPal innerhalb von 14 Tagen nach Bestätigung. Ohne Antwort innerhalb von 14 Tagen nach der Bekanntgabe rückt die nächste Person nach. Der Preis ist nicht übertragbar und wird nicht in anderer Form ausgezahlt.'],
      ['Datenschutz', 'Der Veranstalter verarbeitet Kanalname, Kanal-ID und Spielfortschritt zur Durchführung der Aktion, für die Auszahlung zusätzlich die E-Mail- und PayPal-Adresse, die du schickst. Die Daten werden nach der Auszahlung gelöscht, soweit keine gesetzliche Aufbewahrungspflicht besteht. Der Spielfortschritt wird 30 Tage nach deiner letzten Chat-Aktivität gelöscht. Auskunft und Löschung: ' + MAIL + '. ' + PRIV('Ganze Datenschutzerklärung')],
      ['Änderungen', 'Der Veranstalter kann die Aktion nur aus wichtigem Grund beenden oder anpassen, etwa bei technischen Störungen oder Manipulation. Bereits gewonnene Preise bleiben gültig. Veröffentlichte Bedingungen werden nicht nachträglich zum Nachteil der Teilnehmer geändert.']],
    contact: 'Kontakt:', copy: 'E-Mail kopieren', copied: 'Kopiert', binding: 'Verbindlich ist die englische Fassung dieser Bedingungen. Andere Sprachen sind Übersetzungen zur Orientierung.', updated: 'Stand: 9. Oktober 2026' },
  es: { langLabel: 'Idioma', h1: '10 € para el primero que complete las 4 misiones', lead: 'Sé el primero en completar las cuatro misiones del juego en directo FAT BOY LIVE y gana 10 € por PayPal. Participar es gratis. No hace falta like, suscripción ni regalo.', check: 'Tu progreso: escribe <code>!check prize</code> en el chat en directo',
    missionsTitle: 'Las 4 misiones', missions: [['Invasiones Glorp', 'A veces los alienígenas Glorp invaden el directo. En cuanto empiece la invasión, escribe <span class="cmd">pew</span> en el chat. Cuenta cualquier pew escrito durante la invasión (y hasta 20 segundos después, porque el chat llega con retraso). Cada invasión cuenta una vez, escribas pew las veces que sea.'], ['Eventos del admin', 'Cuando el streamer escribe su primer mensaje de admin, se abre una ventana de 2 minutos con una cuenta atrás en pantalla. Escribe <span class="cmd">!joinedadmin</span> en el chat dentro de esos 2 minutos. Cada evento cuenta una vez. Necesitas 3 eventos distintos.'], ['Engordar a Fat Boy', 'Escribe uno de los comandos GORDO de abajo, por ejemplo <span class="cmd">!pizza</span>. Cada comando bien escrito cuenta una vez, aunque Fat Boy esté ocupado o el comando esté en espera.'], ['Hacer más sano a Fat Boy', 'Escribe uno de los comandos SANO de abajo, por ejemplo <span class="cmd">!salad</span> o <span class="cmd">!workout</span>. Cada comando bien escrito cuenta una vez.']],
    cmdTitle: 'Comandos', fatHead: 'GORDO · misión 3', healthHead: 'SANO · misión 4', cmdNote: 'Empieza tu mensaje con el comando. Mayúsculas y minúsculas dan igual. La palabra entre paréntesis también funciona.',
    spam: '<b>Protección contra spam:</b> como máximo cuenta un comando por persona cada 20 segundos, gordo o sano. Llegar a 250 + 250 lleva tiempo, y ese es el reto. Bots, cuentas múltiples y spam no cuentan.',
    rulesTitle: 'Bases oficiales', rules: [
      ['Organizador', 'Fatboy Live, responsable del canal de YouTube “Fat Boy - Live” (@fatboy_live). Contacto: ' + MAIL + '.'],
      ['Sin relación con YouTube', 'Esta promoción no está patrocinada, respaldada ni administrada por YouTube o Google, ni está asociada con ellos. Todas las preguntas van solo al organizador. Al participar eximes a YouTube y Google de cualquier responsabilidad relacionada con esta promoción.'],
      ['Gratis', 'No se requiere compra, like, suscripción, número de visualizaciones, regalo de pago ni Super Chat, y nada de eso mejora tus posibilidades.'],
      ['Quién puede participar', 'Personas de 16 años o más. Los menores de 18 necesitan permiso de sus padres o tutores, que el organizador puede pedir antes del pago. El organizador y quienes ayudan a desarrollar el juego no pueden participar.'],
      ['Qué cuenta', 'Solo lo que el juego registra automáticamente, según las misiones. Los mensajes normales del chat, los votos en encuestas, likes, suscripciones, visualizaciones y regalos no cuentan para el premio. Las demás tareas del juego solo dan logros, no dinero.'],
      ['Un ganador', 'Gana la primera persona que complete la última de las cuatro misiones según el registro del juego. Cuentan las misiones completadas antes del inicio. Deciden el orden de los logros en el registro automático y el ID del canal de YouTube. La promoción empieza con su anuncio en el directo y termina cuando se entrega el premio, a más tardar el 31 de diciembre de 2026.'],
      ['Descalificación y revisión', 'El spam, los bots, varias cuentas de una misma persona, los acuerdos o aprovechar errores llevan a la descalificación. El organizador revisa el registro en un plazo de 7 días. Si se descalifica al primero, pasa la siguiente persona que completó las cuatro misiones.'],
      ['Premio y pago', 'El premio es de 10 € (diez euros). El ganador se anuncia en el directo con el nombre de su canal y escribe a ' + MAIL + ' con el nombre de su canal y una dirección de PayPal. Pago por PayPal en un plazo de 14 días tras la confirmación. Si el ganador no responde en 14 días desde el anuncio, pasa la siguiente persona. El premio no es transferible ni se paga de otra forma.'],
      ['Privacidad', 'El organizador trata el nombre y el ID de tu canal y tu progreso en el juego para realizar la promoción, y además el correo y la dirección de PayPal que envíes para el pago. Estos datos se borran tras el pago salvo que la ley obligue a conservarlos. El progreso del juego se borra 30 días después de tu última actividad en el chat. Solicitudes de acceso o borrado: ' + MAIL + '. ' + PRIV('Política de privacidad completa')],
      ['Cambios', 'El organizador solo puede terminar o ajustar la promoción por un motivo justificado, como problemas técnicos o manipulación. Los premios ya ganados siguen siendo válidos. Las bases publicadas no se cambian después en perjuicio de los participantes.']],
    contact: 'Contacto:', copy: 'Copiar correo', copied: 'Copiado', binding: 'La versión en inglés de estas bases es la vinculante. Los demás idiomas son traducciones orientativas.', updated: 'Última actualización: 9 de octubre de 2026' },
  fr: { langLabel: 'Langue', h1: '10 € pour le premier qui réussit les 4 missions', lead: 'Sois le premier à réussir les quatre missions du jeu en direct FAT BOY LIVE et gagne 10 € via PayPal. Participation gratuite. Aucun like, abonnement ou cadeau nécessaire.', check: 'Ta progression : écris <code>!check prize</code> dans le chat en direct',
    missionsTitle: 'Les 4 missions', missions: [['Invasions Glorp', 'Parfois, les extraterrestres Glorp envahissent le live. Dès que l’invasion commence, écris <span class="cmd">pew</span> dans le chat. Chaque pew écrit pendant l’invasion compte (et jusqu’à 20 secondes après, car le chat arrive avec du retard). Chaque invasion compte une fois, peu importe combien de fois tu écris pew.'], ['Événements admin', 'Quand le streamer écrit son premier message admin, une fenêtre de 2 minutes s’ouvre avec un compte à rebours à l’écran. Écris <span class="cmd">!joinedadmin</span> dans le chat pendant ces 2 minutes. Chaque événement compte une fois. Il te faut 3 événements différents.'], ['Faire grossir Fat Boy', 'Écris une des commandes GRAS ci-dessous, par exemple <span class="cmd">!pizza</span>. Chaque commande bien écrite compte une fois, même si Fat Boy est occupé ou si la commande est brièvement bloquée.'], ['Rendre Fat Boy plus sain', 'Écris une des commandes SAIN ci-dessous, par exemple <span class="cmd">!salad</span> ou <span class="cmd">!workout</span>. Chaque commande bien écrite compte une fois.']],
    cmdTitle: 'Commandes', fatHead: 'GRAS · mission 3', healthHead: 'SAIN · mission 4', cmdNote: 'Commence ton message par la commande. Majuscules et minuscules n’ont pas d’importance. Le mot entre parenthèses fonctionne aussi.',
    spam: '<b>Protection anti-spam :</b> au maximum une commande par personne compte toutes les 20 secondes, gras ou sain. Atteindre 250 + 250 prend du temps, et c’est tout le défi. Les bots, les comptes multiples et le spam ne comptent pas.',
    rulesTitle: 'Règlement officiel', rules: [
      ['Organisateur', 'Fatboy Live, exploitant de la chaîne YouTube « Fat Boy - Live » (@fatboy_live). Contact : ' + MAIL + '.'],
      ['Aucun lien avec YouTube', 'Cette opération n’est ni sponsorisée, ni soutenue, ni organisée par YouTube ou Google, et n’y est pas associée. Toutes les questions s’adressent uniquement à l’organisateur. En participant, tu dégages YouTube et Google de toute responsabilité liée à cette opération.'],
      ['Gratuit', 'Aucun achat, like, abonnement, nombre de vues, cadeau payant ou Super Chat n’est requis, et rien de cela n’augmente tes chances.'],
      ['Qui peut participer', 'Toute personne de 16 ans ou plus. Les moins de 18 ans ont besoin de l’accord d’un parent ou tuteur, que l’organisateur peut demander avant le paiement. L’organisateur et les personnes qui participent au développement du jeu ne peuvent pas participer.'],
      ['Ce qui compte', 'Uniquement ce que le jeu enregistre automatiquement, comme décrit dans les missions. Les messages normaux du chat, les votes aux sondages, les likes, abonnements, vues et cadeaux ne comptent pas pour le prix. Les autres tâches du jeu donnent seulement des succès, pas d’argent.'],
      ['Un seul gagnant', 'Le gagnant est la première personne à terminer la dernière des quatre missions selon le journal du jeu. Les missions réussies avant le début comptent. L’ordre des succès dans le journal automatique et l’ID de chaîne YouTube font foi. L’opération commence avec son annonce en live et se termine quand le prix est attribué, au plus tard le 31 décembre 2026.'],
      ['Exclusion et vérification', 'Le spam, les bots, plusieurs comptes d’une même personne, les ententes ou l’exploitation de bugs entraînent l’exclusion. L’organisateur vérifie le journal sous 7 jours. Si le premier est exclu, la personne suivante ayant réussi les quatre missions prend sa place.'],
      ['Prix et paiement', 'Le prix est de 10 € (dix euros). Le gagnant est annoncé en live avec le nom de sa chaîne et écrit à ' + MAIL + ' avec le nom de sa chaîne et une adresse PayPal. Paiement via PayPal sous 14 jours après confirmation. Sans réponse dans les 14 jours suivant l’annonce, la personne suivante prend sa place. Le prix n’est ni cessible ni payable sous une autre forme.'],
      ['Données personnelles', 'L’organisateur traite le nom et l’ID de ta chaîne ainsi que ta progression dans le jeu pour mener l’opération, plus l’e-mail et l’adresse PayPal que tu envoies pour le paiement. Ces données sont supprimées après le paiement, sauf obligation légale de conservation. La progression dans le jeu est supprimée 30 jours après ta dernière activité dans le chat. Demandes d’accès ou de suppression : ' + MAIL + '. ' + PRIV('Politique de confidentialité complète')],
      ['Modifications', 'L’organisateur ne peut arrêter ou modifier l’opération que pour un motif sérieux, comme un problème technique ou une manipulation. Les prix déjà gagnés restent valables. Le règlement publié n’est pas modifié ensuite au détriment des participants.']],
    contact: 'Contact :', copy: 'Copier l’e-mail', copied: 'Copié', binding: 'La version anglaise de ce règlement fait foi. Les autres langues sont des traductions pour information.', updated: 'Dernière mise à jour : 9 octobre 2026' },
  tr: { langLabel: 'Dil', h1: '4 görevin hepsini ilk tamamlayana 10 €', lead: 'FAT BOY LIVE canlı yayın oyunundaki dört görevin hepsini ilk sen bitir ve PayPal ile 10 € kazan. Katılım ücretsiz. Beğeni, abonelik veya hediye gerekmez.', check: 'İlerlemen: canlı sohbete <code>!check prize</code> yaz',
    missionsTitle: '4 görev', missions: [['Glorp istilaları', 'Bazen Glorp uzaylıları yayını istila eder. İstila başlar başlamaz sohbete <span class="cmd">pew</span> yaz. İstila sırasında (ve sohbet gecikmeli geldiği için bitişten sonraki 20 saniyeye kadar) yazılan her pew sayılır. Kaç kez pew yazarsan yaz, her istila bir kez sayılır.'], ['Admin etkinlikleri', 'Yayıncı ilk admin mesajını yazınca ekranda geri sayımlı 2 dakikalık bir süre başlar. Bu 2 dakika içinde sohbete <span class="cmd">!joinedadmin</span> yaz. Her admin etkinliği bir kez sayılır. 3 farklı admin etkinliği gerekir.'], ['Fat Boy’u şişmanlat', 'Aşağıdaki ŞİŞMAN komutlarından birini yaz, örneğin <span class="cmd">!pizza</span>. Doğru yazılan her komut bir kez sayılır; Fat Boy meşgul olsa veya komut kısa süre beklemede olsa bile.'], ['Fat Boy’u sağlıklı yap', 'Aşağıdaki SAĞLIKLI komutlarından birini yaz, örneğin <span class="cmd">!salad</span> veya <span class="cmd">!workout</span>. Doğru yazılan her komut bir kez sayılır.']],
    cmdTitle: 'Komutlar', fatHead: 'ŞİŞMAN · görev 3', healthHead: 'SAĞLIKLI · görev 4', cmdNote: 'Mesajın komutla başlamalı. Büyük/küçük harf fark etmez. Parantez içindeki kelime de çalışır.',
    spam: '<b>Spam koruması:</b> kişi başına en fazla 20 saniyede bir komut sayılır, şişman ya da sağlıklı. 250 + 250’ye ulaşmak zaman alır, meydan okuma da bu. Botlar, birden fazla hesap ve spam sayılmaz.',
    rulesTitle: 'Resmi kurallar', rules: [
      ['Düzenleyen', 'Fatboy Live, “Fat Boy - Live” (@fatboy_live) YouTube kanalının işletmecisi. İletişim: ' + MAIL + '.'],
      ['YouTube ile bağlantısı yok', 'Bu kampanya hiçbir şekilde YouTube veya Google tarafından desteklenmez, onaylanmaz, yönetilmez ve onlarla ilişkili değildir. Tüm sorular yalnızca düzenleyene iletilir. Katılarak YouTube ve Google’ı bu kampanyayla ilgili her türlü sorumluluktan muaf tutarsın.'],
      ['Ücretsiz', 'Satın alma, beğeni, abonelik, izlenme sayısı, ücretli hediye veya Super Chat gerekmez ve bunların hiçbiri şansını artırmaz.'],
      ['Kimler katılabilir', '16 yaş ve üzeri herkes. 18 yaş altındakiler ebeveyn veya vasi izni gerektirir; düzenleyen bunu ödemeden önce isteyebilir. Düzenleyen ve oyunun geliştirilmesine yardım edenler katılamaz.'],
      ['Neler sayılır', 'Yalnızca oyunun görevlerde anlatıldığı gibi otomatik olarak kaydettikleri. Normal sohbet mesajları, anket oyları, beğeniler, abonelikler, izlenmeler ve hediyeler ödül için sayılmaz. Oyundaki diğer görevler sadece başarı kazandırır, para değil.'],
      ['Tek kazanan', 'Kazanan, oyun kaydına göre dört görevin sonuncusunu ilk tamamlayan kişidir. Başlangıçtan önce tamamlanan görevler de sayılır. Otomatik kayıttaki başarı sırası ve YouTube kanal kimliği belirleyicidir. Kampanya canlı yayında duyurulmasıyla başlar ve ödül verildiğinde, en geç 31 Aralık 2026’da sona erer.'],
      ['Diskalifiye ve inceleme', 'Spam, botlar, aynı kişiye ait birden fazla hesap, anlaşmalı hareket veya hataları kullanmak diskalifiyeye yol açar. Düzenleyen kaydı 7 gün içinde inceler. İlk kişi diskalifiye edilirse, dört görevi sıradaki tamamlayan kişi kazanır.'],
      ['Ödül ve ödeme', 'Ödül 10 € (on euro). Kazanan canlı yayında kanal adıyla duyurulur ve kanal adını ve PayPal adresini ' + MAIL + ' adresine e-postayla gönderir. Ödeme, onaydan sonra 14 gün içinde PayPal ile yapılır. Kazanan duyurudan sonraki 14 gün içinde yanıt vermezse sıradaki kişi kazanır. Ödül devredilemez ve başka bir şekilde ödenemez.'],
      ['Gizlilik', 'Düzenleyen, kampanyayı yürütmek için kanal adını, kanal kimliğini ve oyundaki ilerlemeni, ödeme için de gönderdiğin e-posta ve PayPal adresini işler. Bu veriler, yasal saklama yükümlülüğü yoksa ödemeden sonra silinir. Oyundaki ilerleme, sohbetteki son etkinliğinden 30 gün sonra silinir. Erişim veya silme talepleri: ' + MAIL + '. ' + PRIV('Gizlilik politikasının tamamı')],
      ['Değişiklikler', 'Düzenleyen kampanyayı yalnızca teknik sorunlar veya manipülasyon gibi haklı bir nedenle sonlandırabilir veya değiştirebilir. Kazanılmış ödüller geçerli kalır. Yayımlanan kurallar daha sonra katılımcıların aleyhine değiştirilmez.']],

  pt: { langLabel: 'Idioma', h1: '10 € para o primeiro que concluir as 4 missões', lead: 'Seja o primeiro a concluir as quatro missões do jogo ao vivo FAT BOY LIVE e ganhe 10 € via PayPal. Participação gratuita. Não precisa de like, inscrição ou presente.', check: 'Seu progresso: escreva <code>!check prize</code> no chat ao vivo',
    missionsTitle: 'As 4 missões', missions: [['Invasões Glorp', 'Às vezes os alienígenas Glorp invadem a live. Assim que a invasão começar, escreva <span class="cmd">pew</span> no chat. Vale qualquer pew escrito durante a invasão (e até 20 segundos depois, porque o chat chega com atraso). Cada invasão conta uma vez, não importa quantas vezes você escreva pew.'], ['Eventos do admin', 'Quando o streamer escreve a primeira mensagem de admin, abre-se uma janela de 2 minutos com contagem regressiva na tela. Escreva <span class="cmd">!joinedadmin</span> no chat dentro desses 2 minutos. Cada evento conta uma vez. Você precisa de 3 eventos diferentes.'], ['Engordar o Fat Boy', 'Escreva um dos comandos GORDO abaixo, por exemplo <span class="cmd">!pizza</span>. Cada comando escrito corretamente conta uma vez, mesmo se o Fat Boy estiver ocupado ou o comando estiver em espera.'], ['Deixar o Fat Boy mais saudável', 'Escreva um dos comandos SAUDÁVEL abaixo, por exemplo <span class="cmd">!salad</span> ou <span class="cmd">!workout</span>. Cada comando escrito corretamente conta uma vez.']],
    cmdTitle: 'Comandos', fatHead: 'GORDO · missão 3', healthHead: 'SAUDÁVEL · missão 4', cmdNote: 'Comece a mensagem com o comando. Maiúsculas e minúsculas não importam. A palavra entre parênteses também funciona.',
    spam: '<b>Proteção contra spam:</b> conta no máximo um comando por pessoa a cada 20 segundos, gordo ou saudável. Chegar a 250 + 250 leva tempo, e esse é o desafio. Bots, várias contas e spam não contam.',
    rulesTitle: 'Regulamento oficial', rules: [
      ['Organizador', 'Fatboy Live, responsável pelo canal do YouTube “Fat Boy - Live” (@fatboy_live). Contato: ' + MAIL + '.'],
      ['Sem ligação com o YouTube', 'Esta promoção não é patrocinada, apoiada nem administrada pelo YouTube ou pelo Google, nem está associada a eles. Todas as dúvidas vão somente ao organizador. Ao participar, você isenta o YouTube e o Google de qualquer responsabilidade relacionada a esta promoção.'],
      ['Gratuito', 'Não é necessária compra, like, inscrição, número de visualizações, presente pago ou Super Chat, e nada disso aumenta suas chances.'],
      ['Quem pode participar', 'Pessoas com 16 anos ou mais. Menores de 18 precisam de autorização dos pais ou responsáveis, que o organizador pode pedir antes do pagamento. O organizador e quem ajuda a desenvolver o jogo não podem participar.'],
      ['O que conta', 'Somente o que o jogo registra automaticamente, como descrito nas missões. Mensagens normais no chat, votos em enquetes, likes, inscrições, visualizações e presentes não contam para o prêmio. As outras tarefas do jogo dão apenas conquistas, não dinheiro.'],
      ['Um vencedor', 'Vence a primeira pessoa a concluir a última das quatro missões segundo o registro do jogo. Missões concluídas antes do início contam. Decidem a ordem das conquistas no registro automático e o ID do canal do YouTube. A promoção começa com o anúncio na live e termina quando o prêmio for entregue, no máximo em 31 de dezembro de 2026.'],
      ['Desclassificação e verificação', 'Spam, bots, várias contas de uma mesma pessoa, combinações ou o uso de falhas levam à desclassificação. O organizador verifica o registro em até 7 dias. Se o primeiro for desclassificado, a próxima pessoa que concluiu as quatro missões assume.'],
      ['Prêmio e pagamento', 'O prêmio é de 10 € (dez euros). O vencedor é anunciado na live pelo nome do canal e envia um e-mail para ' + MAIL + ' com o nome do canal e um endereço do PayPal. Pagamento via PayPal em até 14 dias após a confirmação. Se o vencedor não responder em 14 dias após o anúncio, a próxima pessoa assume. O prêmio não é transferível nem pago de outra forma.'],
      ['Privacidade', 'O organizador trata o nome e o ID do seu canal e seu progresso no jogo para realizar a promoção, além do e-mail e do endereço do PayPal que você enviar para o pagamento. Esses dados são apagados após o pagamento, salvo obrigação legal de guarda. O progresso no jogo é apagado 30 dias após sua última atividade no chat. Pedidos de acesso ou exclusão: ' + MAIL + '. ' + PRIV('Política de privacidade completa')],
      ['Alterações', 'O organizador só pode encerrar ou ajustar a promoção por um motivo justo, como problemas técnicos ou manipulação. Prêmios já ganhos continuam válidos. O regulamento publicado não é alterado depois em prejuízo dos participantes.']],
    contact: 'Contato:', copy: 'Copiar e-mail', copied: 'Copiado', binding: 'A versão em inglês deste regulamento é a que vale. Os outros idiomas são traduções para orientação.', updated: 'Atualizado em: 9 de outubro de 2026' },
  it: { langLabel: 'Lingua', h1: '10 € al primo che completa tutte e 4 le missioni', lead: 'Sii il primo a completare le quattro missioni del gioco in diretta FAT BOY LIVE e vinci 10 € tramite PayPal. Partecipazione gratuita. Non servono like, iscrizioni o regali.', check: 'I tuoi progressi: scrivi <code>!check prize</code> nella chat in diretta',
    missionsTitle: 'Le 4 missioni', missions: [['Invasioni Glorp', 'A volte gli alieni Glorp invadono la diretta. Appena inizia l’invasione, scrivi <span class="cmd">pew</span> in chat. Vale ogni pew scritto durante l’invasione (e fino a 20 secondi dopo, perché la chat arriva in ritardo). Ogni invasione conta una volta, non importa quante volte scrivi pew.'], ['Eventi admin', 'Quando lo streamer scrive il primo messaggio admin, si apre una finestra di 2 minuti con un conto alla rovescia sullo schermo. Scrivi <span class="cmd">!joinedadmin</span> in chat entro quei 2 minuti. Ogni evento conta una volta. Servono 3 eventi diversi.'], ['Far ingrassare Fat Boy', 'Scrivi uno dei comandi GRASSO qui sotto, per esempio <span class="cmd">!pizza</span>. Ogni comando scritto correttamente conta una volta, anche se Fat Boy è occupato o il comando è temporaneamente in pausa.'], ['Rendere Fat Boy più sano', 'Scrivi uno dei comandi SANO qui sotto, per esempio <span class="cmd">!salad</span> o <span class="cmd">!workout</span>. Ogni comando scritto correttamente conta una volta.']],
    cmdTitle: 'Comandi', fatHead: 'GRASSO · missione 3', healthHead: 'SANO · missione 4', cmdNote: 'Inizia il messaggio con il comando. Maiuscole e minuscole non contano. Anche la parola tra parentesi funziona.',
    spam: '<b>Protezione anti-spam:</b> conta al massimo un comando a persona ogni 20 secondi, grasso o sano. Arrivare a 250 + 250 richiede tempo, ed è questa la sfida. Bot, account multipli e spam non contano.',
    rulesTitle: 'Regolamento ufficiale', rules: [
      ['Organizzatore', 'Fatboy Live, gestore del canale YouTube “Fat Boy - Live” (@fatboy_live). Contatto: ' + MAIL + '.'],
      ['Nessun legame con YouTube', 'Questa promozione non è sponsorizzata, sostenuta o gestita da YouTube o Google, né è associata a loro. Tutte le domande vanno solo all’organizzatore. Partecipando sollevi YouTube e Google da ogni responsabilità legata a questa promozione.'],
      ['Gratuita', 'Non servono acquisti, like, iscrizioni, un numero di visualizzazioni, regali a pagamento o Super Chat, e nulla di tutto ciò aumenta le tue possibilità.'],
      ['Chi può partecipare', 'Chiunque abbia almeno 16 anni. I minori di 18 anni hanno bisogno del consenso di un genitore o tutore, che l’organizzatore può chiedere prima del pagamento. L’organizzatore e chi aiuta a sviluppare il gioco non possono partecipare.'],
      ['Cosa conta', 'Solo ciò che il gioco registra automaticamente, come descritto nelle missioni. I normali messaggi in chat, i voti ai sondaggi, like, iscrizioni, visualizzazioni e regali non contano per il premio. Gli altri compiti del gioco danno solo obiettivi, non denaro.'],
